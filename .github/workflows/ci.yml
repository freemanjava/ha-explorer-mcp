name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: build + vet + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # golangci-lint is deliberately not installed here: `make check` must stay
      # green without it (CLAUDE.md), so CI exercises that path.
      - run: make check

  release:
    name: cross-build linux/amd64 + linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make release
