name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Backstop for CLAUDE.md's "SUPERVISOR_TOKEN never leaves" and the broader
  # no-secrets-in-history posture: this gate can't be skipped by a clone that
  # never ran `git config core.hooksPath githooks` (see githooks/pre-commit).
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: build + vet + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # golangci-lint is deliberately not installed here: `make check` must stay
      # green without it (CLAUDE.md), so CI exercises that path.
      - run: make check

  release:
    name: cross-build linux/amd64 + linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make release
