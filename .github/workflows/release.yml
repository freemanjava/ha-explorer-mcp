name: Release App image

# Publishes the App as a multi-arch image (App-distribution decision,
# docs/development/phases/00-spike-foundations.md). Supervisor never builds
# this App — it only pulls the tag addon/config.yaml's `image:` names.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  publish:
    name: build + push aarch64/amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # config.yaml's version: is the single source of truth for the tag —
      # never write the version a second time in this workflow.
      - name: Read version from addon/config.yaml
        id: version
        run: |
          version=$(grep '^version:' addon/config.yaml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "could not read version: from addon/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two single-platform images, not one multi-arch manifest: config.yaml's
      # `image:` uses the `{arch}` placeholder Supervisor substitutes with
      # aarch64/amd64, so each architecture is its own tag.
      - name: Build and push aarch64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/freemanjava/ha-explorer-mcp/aarch64-ha-inspector-mcp:${{ steps.version.outputs.version }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/freemanjava/ha-explorer-mcp/amd64-ha-inspector-mcp:${{ steps.version.outputs.version }}
