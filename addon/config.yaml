name: "HA Inspector MCP"
version: "0.9.4"
slug: "ha_inspector_mcp"
description: "Read-only diagnostic MCP server for Home Assistant"
url: "https://github.com/freemanjava/ha-explorer-mcp"
arch:
  - aarch64
  - amd64

# Published image, not a local Supervisor build — App-distribution decision,
# phases/00-spike-foundations.md. Supervisor substitutes {arch} with the
# installing device's architecture (aarch64/amd64) and pulls this tag:version.
# The package is private; see docs/INSTALL.md for the registry-credential step
# Supervisor needs before the pull succeeds.
image: "ghcr.io/freemanjava/ha-explorer-mcp/{arch}-ha-inspector-mcp"

# The Go binary handles its own signal handling; no s6/tini init needed.
init: false

# Security posture — architecture doc §15.2. Read-only diagnostics only.
# These flags declare intent and bound blast radius; they are not the
# enforcement point. supervisor/api is reachable over homeassistant_api
# regardless of hassio_api (F-13) — the read-only guarantee is enforced by
# internal/ha/gateway.go's allow-list and named deny set (P1-07).
#
# hassio_api: true at the default role (hassio_role unset) grants only paths
# ending in /info — /supervisor/info (which embeds the installed-App
# inventory), /os/info, /host/info, /resolution/info, /network/info,
# /hardware/info, /jobs/info — plus what api_bypass already granted at false
# (/info, /addons/self/*). It grants no */stats beyond this App's own and no
# write-capable path whatsoever: a role above default would (docs/research/
# 2026-08-23-supervisor-permissions.md; phase 00 "Supervisor permission
# level" decision, 2026-08-25).
homeassistant_api: true
hassio_api: true
docker_api: false
host_network: false
full_access: false
privileged: []
protection: true
apparmor: true

# No /config, no Recorder DB, no host filesystem — see CLAUDE.md "Not Yet".
map: []

# D-08-6: the listener's container port, published nowhere until the owner
# picks a host port on the App's Network tab. "Closed" is the host side only —
# other Apps on the hassio network still reach it, which is why http_secret has
# no default and a missing one refuses start (D-08-4, D-08-9).
ports:
  8790/tcp: null

# D-08-12: the two settings an owner needs on the Pi. Budget limits are
# measured constants, not options. http_secret (D-08-9) is the client's bearer
# secret: required, masked in the UI, and deliberately without a default.
options:
  privacy_profile: mask
  log_level: info
schema:
  http_secret: password
  privacy_profile: list(mask|allow|deny)
  log_level: list(debug|info|warn|error)
